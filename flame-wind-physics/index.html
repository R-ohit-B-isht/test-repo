<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PYRE — Real-time 2D Fire &amp; Wind Physics</title>
<meta name="description" content="GPU Navier–Stokes fire simulation with turbulent wind, combustion, buoyancy and blackbody rendering." />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<canvas id="fluid"></canvas>
<canvas id="embers"></canvas>

<header id="brand">
  <span class="eyebrow">01 / SIMULATION</span>
  <h1>PYRE</h1>
  <p>Navier&ndash;Stokes fire &middot; turbulent wind &middot; blackbody radiation</p>
</header>

<aside id="panel">
  <button id="panelToggle" aria-label="Toggle controls">&#8801;</button>
  <span class="eyebrow">02 / WIND</span>
  <div class="ctl">
    <label>strength <span class="val" id="windVal">0.0</span></label>
    <input type="range" id="wind" min="-100" max="100" value="0" />
  </div>
  <div class="ctl">
    <label>gustiness <span class="val" id="gustVal">40</span></label>
    <input type="range" id="gust" min="0" max="100" value="40" />
  </div>
  <span class="eyebrow">03 / FIRE</span>
  <div class="ctl">
    <label>fuel <span class="val" id="fuelVal">65</span></label>
    <input type="range" id="fuel" min="10" max="100" value="65" />
  </div>
  <div class="ctl">
    <label>vorticity <span class="val" id="vortVal">18</span></label>
    <input type="range" id="vort" min="0" max="50" value="18" />
  </div>
  <div class="ctl">
    <label>cooling <span class="val" id="coolVal">55</span></label>
    <input type="range" id="cool" min="10" max="100" value="55" />
  </div>
  <div class="row">
    <button id="btnEmbers" class="opt active">embers</button>
    <button id="btnStorm" class="opt">storm</button>
  </div>
</aside>

<div id="windMeter">
  <span class="eyebrow">WIND</span>
  <div class="bar"><div id="windBar"></div></div>
  <span id="windText">calm</span>
</div>

<footer id="hint">drag to stir the air &bull; click to ignite &bull; hold shift + drag for pure wind</footer>

<div id="nogl" hidden>
  <p>Your browser does not support the WebGL features required by this simulation.</p>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
