<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Split · Vietnam planner</title>
  <meta name="description" content="Who paid what, on which day, and who owes whom — the group ledger for the trip, kept in your browser." />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f7f2e8" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body data-page="split">
  <a class="skip" href="#main">Skip to content</a>
  <div class="progress" id="progress" aria-hidden="true"></div>

  <header class="topbar">
    <div class="wrap" id="topbar"></div>
  </header>

  <main id="main">
    <section class="section page-top" id="split" aria-labelledby="split-title">
      <div class="wrap">
        <div class="section-head reveal">
          <div>
            <span class="eyebrow">09 · Split</span>
            <h1 class="page-title" id="split-title">Who paid. Who owes. Sorted.</h1>
          </div>
          <div class="spl-headbar" id="spl-head"></div>
        </div>
        <div id="spl-me-wrap"></div>
        <div class="spl-people reveal" id="spl-people" aria-label="People"></div>
        <div class="spl-grid">
          <div class="spl-main">
            <div class="spl-filter reveal" id="spl-filter"></div>
            <div class="spl-ledger" id="spl-ledger"></div>
            <p class="sub ms-bin" id="spl-bin"></p>
          </div>
          <aside class="spl-side">
            <div id="spl-sum"></div>
            <div id="spl-daily"></div>
            <div id="spl-bal"></div>
            <div id="spl-fx"></div>
            <div id="spl-cash"></div>
            <div id="spl-tools"></div>
          </aside>
        </div>
      </div>
    </section>
    <div class="wrap">
      <nav class="pager" id="pager" aria-label="Pages"></nav>
    </div>
  </main>

  <button class="fab" id="spl-fab" type="button" data-new aria-label="Add an expense" hidden>
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <footer class="footer">
    <div class="wrap" id="footer"></div>
  </footer>

  <nav class="rail" id="rail" aria-label="Section index"></nav>
  <nav class="tabbar" id="tabbar" aria-label="Pages"></nav>
  <div class="netbar" id="netbar" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
