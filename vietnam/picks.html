<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Picks · Vietnam planner</title>
  <meta name="description" content="Every place and activity as a toggle with a price and a source. Tap it on, the days repack." />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f7f2e8" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body data-page="picks">
  <a class="skip" href="#main">Skip to content</a>
  <div class="progress" id="progress" aria-hidden="true"></div>

  <header class="topbar">
    <div class="wrap" id="topbar"></div>
  </header>

  <main id="main">
    <section class="section page-top" id="picker" aria-labelledby="picker-title">
      <div class="wrap">
        <div class="section-head reveal">
          <div>
            <span class="eyebrow">04 · Pick your stuff</span>
            <h1 class="page-title" id="picker-title">Tap it on. We slot it in.</h1>
          </div>
          <div class="picker-sum" id="picker-sum" aria-live="polite"></div>
        </div>
        <div class="picker-bar reveal">
          <div class="seg picker-tabs" id="picker-tabs" role="tablist" aria-label="Stop"></div>
          <div class="seg picker-kind" id="picker-kind" role="tablist" aria-label="Fun or see"></div>
        </div>
        <div class="picker-votes reveal" id="picker-votes"></div>
        <div class="picker reveal" id="picker-grid"></div>
        <div class="picker-extra reveal" id="picker-extra"></div>
      </div>
    </section>
    <div class="wrap">
      <nav class="pager" id="pager" aria-label="Pages"></nav>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap" id="footer"></div>
  </footer>

  <nav class="rail" id="rail" aria-label="Section index"></nav>
  <nav class="tabbar" id="tabbar" aria-label="Pages"></nav>
  <div class="netbar" id="netbar" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
