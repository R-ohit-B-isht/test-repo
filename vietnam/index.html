<!doctype html>
<html lang="en">
<head>

  <title>Vietnam, middle then north: 8 days from Delhi, cheaper than ₹40k</title>
  <meta name="description" content="A visual planner for eight days in northern and central Vietnam from Delhi in late October: route trade-offs, sourced prices, a per-person budget and a booking checklist." />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f7f2e8" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body data-page="route">

    <div class="wrap">
      <nav class="pager" id="pager" aria-label="Pages"></nav>

    <div class="wrap" id="footer"></div>
