[project]
name = "skin-ledger-chat-api"
version = "0.1.0"
description = "Gemini assistant over the Skin Ledger generated dataset (manifest-driven, tool-grounded, streaming)."
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "google-genai==2.20.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chat_api*"]
