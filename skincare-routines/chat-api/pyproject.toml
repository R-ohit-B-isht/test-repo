[tool.poetry]
name = "skin-ledger-chat-api"
version = "0.1.0"
description = "Gemini assistant over the Skin Ledger generated dataset (manifest-driven, tool-grounded, streaming)."
authors = ["Skin Ledger"]
packages = [{ include = "chat_api" }, { include = "app" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
fastapi = { version = "0.141.1", extras = ["standard"] }
uvicorn = { version = "0.52.4", extras = ["standard"] }
google-genai = "2.20.0"
httpx = ">=0.27,<1.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
pytest-asyncio = ">=0.23"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
